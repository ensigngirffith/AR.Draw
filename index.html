<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Modern AR Tracing App</title>
    <style>
        :root {
            --primary-blue: #007AFF;
            --neon-blue: #00f2fe;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0b0f19;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Camera Stream Layer */
        #camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Image Tracing Overlay */
        #image-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #trace-image {
            max-width: 50vw;
            max-height: 50vh;
            opacity: 0.5;
            will-change: transform, opacity;
            transition: none; 
        }

        /* Floating Status Header */
        #instructions {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            font-size: 13px;
            letter-spacing: 0.5px;
            width: 80%;
            max-width: 340px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Modern Dashboard Control HUD */
        #ui-container {
            position: absolute;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 380px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Neon-blue button style */
        .file-upload-btn {
            background: linear-gradient(135deg, var(--primary-blue), #0051ba);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .file-upload-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
        }

        #file-input {
            display: none;
        }

        /* Sleek Slider Controls */
        .ui-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value-display {
            color: var(--neon-blue);
            font-family: monospace;
            font-weight: bold;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        /* Custom Blue Sliders track details */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5), 0 2px 4px rgba(0,0,0,0.3);
            cursor: pointer;
            border: 2px solid var(--primary-blue);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        /* Animations */
        @keyframes slideUp {
            from { transform: translate(-50%, 40px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes fadeInDown {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="instructions">Mount your phone securely above your paper to begin tracing.</div>

    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="image-wrapper">
        <img id="trace-image" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNDAwIiB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIj48ZyBmaWxsPSJub25lIiBzdHJva2U9IiMwMGYyZmUiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBvcGFjaXR5PSIwLjciPjxjaXJjbGUgY3g9IjIwMCIgY3k9IjIwMCIgcj0iMTcwIi8+PGNpcmNsZSBjeD0iMjAwIiBjeT0iMjAwIiByPSI0MCIvPjxwYXRoIGQ9Ik0gMjAwIDIwIEwgMjAwIDE2MCBNIDIwMCAyNDAgTCAyMDAgMzgwIE0gMjAgMjAwIEwgMTYwIDIwMCBNIDI0MCAyMDAgTCAzODAgMjAwIi8+PC9nPjwvc3ZnPg==" alt="Tracing Template">
    </div>

    <div id="ui-container">
        <label for="file-input" class="file-upload-btn">
            <span>📂</span> Load Blueprint / Image
        </label>
        <input type="file" id="file-input" accept="image/*">

        <div class="ui-row">
            <div class="label-row">
                <span>Opacity</span>
                <span id="opacity-val" class="value-display">50%</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>

        <div class="ui-row">
            <div class="label-row">
                <span>Scale Size</span>
                <span id="scale-val" class="value-display">1.0x</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="scale-slider" min="0.2" max="3" step="0.01" value="1">
            </div>
        </div>
        
        <div class="ui-row">
            <div class="label-row">
                <span>Rotation Angle</span>
                <span id="rotation-val" class="value-display">0°</span>
            </div>
            <div class="slider-wrapper">
                <input type="range" id="rotation-slider" min="-180" max="180" step="1" value="0">
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const traceImage = document.getElementById('trace-image');
        const opacitySlider = document.getElementById('opacity-slider');
        const scaleSlider = document.getElementById('scale-slider');
        const rotationSlider = document.getElementById('rotation-slider');
        const fileInput = document.getElementById('file-input');

        const opacityText = document.getElementById('opacity-val');
        const scaleText = document.getElementById('scale-val');
        const rotationText = document.getElementById('rotation-val');

        let currentScale = 1;
        let currentRotation = 0;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                } catch (fallbackErr) {
                    console.error("Camera error access block.", fallbackErr);
                }
            }
        }

        function updateImageTransform() {
            traceImage.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
        }

        opacitySlider.addEventListener('input', (e) => {
            traceImage.style.opacity = e.target.value;
            opacityText.innerText = `${Math.round(e.target.value * 100)}%`;
        });

        scaleSlider.addEventListener('input', (e) => {
            currentScale = e.target.value;
            scaleText.innerText = `${parseFloat(e.target.value).toFixed(1)}x`;
            updateImageTransform();
        });

        rotationSlider.addEventListener('input', (e) => {
            currentRotation = e.target.value;
            rotationText.innerText = `${e.target.value}°`;
            updateImageTransform();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    traceImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
