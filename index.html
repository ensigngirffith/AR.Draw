<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Universal AR Tracing App</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #000;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Video Container to hold camera stream */
        #camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The Tracing Image Overlay Container */
        #image-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Allows clicks to pass through if needed */
        }

        #trace-image {
            max-width: 90vw;
            max-height: 80vh;
            opacity: 0.5;
            transition: opacity 0.05s linear;
        }

        /* UI Panel Controls */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .ui-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-size: 14px;
        }

        .ui-row label {
            font-weight: 600;
            min-width: 70px;
        }

        input[type="range"] {
            flex-grow: 1;
            margin-left: 10px;
            accent-color: #007AFF;
            cursor: pointer;
        }

        .file-upload-btn {
            background-color: #007AFF;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #file-input {
            display: none;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.75);
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            font-size: 13px;
            width: 80%;
            max-width: 350px;
        }
    </style>
</head>
<body>

    <div id="instructions">Grant camera permissions, then mount your phone over paper to start tracing!</div>

    <!-- Live Webcam Feed View layer -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- Virtual Tracing Image Overlay layer -->
    <div id="image-wrapper">
        <img id="trace-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa_digitally_restored.jpg/320px-Mona_Lisa_digitally_restored.jpg" alt="Tracing Template">
    </div>

    <!-- Custom Control HUD Dashboard -->
    <div id="ui-container">
        <label for="file-input" class="file-upload-btn">📂 Load Custom Image</label>
        <input type="file" id="file-input" accept="image/*">

        <div class="ui-row">
            <label for="opacity-slider">Opacity</label>
            <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="ui-row">
            <label for="scale-slider">Size</label>
            <input type="range" id="scale-slider" min="0.2" max="3" step="0.01" value="1">
        </div>
        
        <div class="ui-row">
            <label for="rotation-slider">Rotate</label>
            <input type="range" id="rotation-slider" min="-180" max="180" step="1" value="0">
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const traceImage = document.getElementById('trace-image');
        const opacitySlider = document.getElementById('opacity-slider');
        const scaleSlider = document.getElementById('scale-slider');
        const rotationSlider = document.getElementById('rotation-slider');
        const fileInput = document.getElementById('file-input');

        let currentScale = 1;
        let currentRotation = 0;

        // 1. Initialize Native Back-Facing Hardware Camera Stream
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: "environment" } // Forces back camera
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Exact environment camera failed, falling back to general video request.", err);
                // Fallback for laptops/devices without dual cameras
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                } catch (fallbackErr) {
                    alert("Error opening your device camera: " + fallbackErr.message);
                }
            }
        }

        // Update CSS Transforms for Scale and Rotation together
        function updateImageTransform() {
            traceImage.style.transform = `scale(${currentScale}) rotate(${currentRotation}deg)`;
        }

        // 2. Control Event Listeners
        opacitySlider.addEventListener('input', (e) => {
            traceImage.style.opacity = e.target.value;
        });

        scaleSlider.addEventListener('input', (e) => {
            currentScale = e.target.value;
            updateImageTransform();
        });

        rotationSlider.addEventListener('input', (e) => {
            currentRotation = e.target.value;
            updateImageTransform();
        });

        // 3. Native Image Uploader Logic
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    traceImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Start running camera pipeline automatically on system load
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
